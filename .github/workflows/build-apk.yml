name: Build Rail Dash Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configure Android SDK environment
        run: |
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install dependencies
        run: npm install

      - name: Generate 115 MB asset bundle
        run: npm run assets:110mb

      - name: Build web app
        run: npm run build

      - name: Add Capacitor Android if missing
        run: |
          npm install @capacitor/android @capacitor/cli
          if [ ! -d "android" ]; then
            npx cap init "Rail Dash" "com.raildash.game" --web-dir dist
            npx cap add android
          fi
          npx cap copy android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK size (>= 110 MB)
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$APK_PATH"
          SIZE_BYTES=$(stat -c%s "$APK_PATH")
          MIN_BYTES=$((110 * 1024 * 1024))
          echo "APK size in bytes: $SIZE_BYTES (Minimum required: $MIN_BYTES)"
          if [ "$SIZE_BYTES" -lt "$MIN_BYTES" ]; then
            echo "ERROR: APK is smaller than 110 MB!"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rail-dash-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
